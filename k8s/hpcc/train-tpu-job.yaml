# Real TPU rung: GKE Autopilot (soe-hpccenter class-tpu-cluster), v5e 2x2 slice.
# Autopilot provisions the TPU node on demand from this selector + request.
# Env: pinned jax[tpu] wheels bootstrapped in the ephemeral container (the class
# cluster has no private registry; docker/Dockerfile.cuda documents the baked
# equivalent).
apiVersion: batch/v1
kind: Job
metadata:
  name: churn-train-tpu
  labels:
    app: churn-hpc
    scale-step: tpu-v5e
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: churn-hpc
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 2x2
      containers:
        - name: trainer
          image: python:3.12-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -e
              T0=$SECONDS
              pip install --no-cache-dir -q "jax[tpu]==0.11.0" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
              pip install --no-cache-dir -q flax==0.12.8 optax==0.2.8 psutil==7.0.0
              echo "===BOOTSTRAP $(($SECONDS-T0))s==="
              python -c "import jax; print('===TPU===', jax.devices())"
              for cfg in "512 tpu-v5e-bs512" "4000 tpu-v5e-bs4000" "16384 tpu-v5e-bs16384"; do
                set -- $cfg
                python /code/train_jax.py --data /data/Churn_Dataset.csv --backend tpu \
                  --batch-size $1 --epochs 400 --label $2 --out /tmp/$2.json
              done
              for f in /tmp/tpu-v5e-*.json; do echo "===RESULT $f==="; cat $f; echo; done
          resources:
            requests: { cpu: "8", memory: 16Gi, google.com/tpu: 4 }
            limits:   { cpu: "8", memory: 16Gi, google.com/tpu: 4 }
          volumeMounts:
            - { name: code, mountPath: /code, readOnly: true }
            - { name: dataset, mountPath: /data, readOnly: true }
      volumes:
        - name: code
          configMap: { name: churn-src }
        - name: dataset
          configMap: { name: churn-data }
